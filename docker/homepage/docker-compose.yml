
version: "3.3"

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest

    container_name: homepage

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ../../configs/homepage:/app/config

    environment:
      - PUID=1000
      - PGID=1000
      - HOMEPAGE_ALLOWED_HOSTS=dashboard.sushantdev.com
